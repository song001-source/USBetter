name: Windows x64 preview
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify
        shell: powershell
        run: ./tools/Package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-preview
          path: |
            dist/*.zip
            dist/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag
        shell: powershell
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag differs from VERSION' }
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-preview
          path: dist
      - name: Publish preview
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME @assets --prerelease --title "USB Tether Helper $env:GITHUB_REF_NAME" --notes-file docs/RELEASE.md
